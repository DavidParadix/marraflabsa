name: Deploy Firebase Rules, Storage and Functions

on:
  push:
    branches:
      - main # Si tu rama principal en GitHub se llama "master", cambia "main" por "master"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI y dependencias de Functions
        run: |
          npm install -g firebase-tools
          cd functions && npm install && cd ..

      - name: Desplegar todo a Firebase
        run: |
          firebase use marraflabsa
          firebase deploy --only firestore:rules,storage,functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARRAFLABSA }}
