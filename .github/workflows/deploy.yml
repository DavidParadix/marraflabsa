name: Deploy Firebase Rules and Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Desplegar solo reglas de Firestore
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARRAFLABSA }}' > ./service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="./service-account.json"
          firebase deploy --only firestore:rules --project marraflabsa
