name: Deploy Firebase Rules and Functions

on:
  push:
    branches:
      - main # O master según tu rama

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI y dependencias de Functions
        run: |
          npm install -g firebase-tools
          cd functions && npm install && cd ..

      - name: Crear archivo temporal de credenciales y desplegar
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARRAFLABSA }}' > ./service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="./service-account.json"
          firebase deploy --only firestore:rules,functions --project marraflabsa
